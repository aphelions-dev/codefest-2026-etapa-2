[project]
name = "radar-backend"
version = "0.1.0"
description = "Radar Estrategico de Tendencias Aeroespaciales: API de agregacion y agente"
license = "Apache-2.0"
requires-python = "==3.12.*"
# Versiones exactas: un rango instala lo que haya el dia del despliegue y el lockfile fija los hashes.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic-settings==2.15.0",
    "asyncpg==0.31.0",
]

[dependency-groups]
dev = []

[tool.uv]
default-groups = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
